services:
  - type: web
    name: brie
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn brie.wsgi
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.12.2"
